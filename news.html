<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>كل الأخبار — Cairo Business</title>
  <meta name="description" content="جميع الأخبار الاقتصادية والمالية في مصر والشرق الأوسط — تغطية فورية محدثة كل 15 دقيقة." />
  <meta name="theme-color" content="#0a0e27" />
  <link rel="canonical" href="https://cairobusiness.net/news.html" />
  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="كل الأخبار — Cairo Business" />
  <meta property="og:description" content="جميع الأخبار الاقتصادية والمالية في مصر والشرق الأوسط — تغطية فورية محدثة كل 15 دقيقة." />
  <meta property="og:image" content="https://cairobusiness.net/og-image.jpg" />
  <meta property="og:url" content="https://cairobusiness.net/news.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', 'Inter', system-ui, sans-serif;
      background: #0a0e27;
      color: #e6e9f0;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }

    /* Header */
    .top-bar {
      background: rgba(10,14,39,.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(244,208,63,.18);
      padding: 16px 0;
      position: sticky; top: 0; z-index: 50;
    }
    .top-bar-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .logo-link { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
    .logo-mark { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #F4D03F, #B8941F); display: grid; place-items: center; color: #0a0e27; font-weight: 900; font-family: 'Playfair Display', serif; font-size: 20px; }
    .logo-text { font-weight: 800; font-size: 16px; }
    .logo-sub { font-size: 10px; color: rgba(244,208,63,.85); display: block; letter-spacing: .15em; }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 16px; border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px; color: rgba(255,255,255,.85);
      font-size: 13px; font-weight: 600;
      text-decoration: none; transition: all .2s ease;
    }
    .back-link:hover { background: rgba(255,255,255,.06); border-color: #F4D03F; color: #F4D03F; }

    /* Page hero */
    .page-hero { padding: 56px 0 32px; text-align: center; }
    .page-eyebrow { font-size: 12px; letter-spacing: .35em; color: #F4D03F; font-weight: 800; text-transform: uppercase; margin-bottom: 12px; }
    .page-title { font-family: 'Playfair Display', 'Cairo', serif; font-size: clamp(32px, 5vw, 52px); font-weight: 900; color: #fff; line-height: 1.1; margin-bottom: 14px; }
    [lang="ar"] .page-title, [dir="rtl"] .page-title { font-family: 'Cairo', 'Playfair Display', serif; }
    .page-sub { font-size: 16px; color: rgba(255,255,255,.6); max-width: 640px; margin: 0 auto; }

    /* Filter bar */
    .filter-bar {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin: 32px 0 24px; padding: 14px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
    }
    .filter-chip {
      padding: 8px 18px; border-radius: 999px;
      background: transparent; border: 1px solid rgba(255,255,255,.1);
      color: rgba(255,255,255,.7); font-size: 13px; font-weight: 700;
      cursor: pointer; transition: all .2s ease;
      font-family: inherit;
    }
    .filter-chip:hover { background: rgba(244,208,63,.08); color: #fff; border-color: rgba(244,208,63,.35); }
    .filter-chip.is-active { background: linear-gradient(135deg, #F4D03F, #B8941F); color: #0a0e27; border-color: transparent; box-shadow: 0 4px 14px rgba(244,208,63,.35); }
    .filter-search {
      flex: 1; min-width: 200px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
      border-radius: 999px; padding: 8px 18px;
      color: #fff; font-size: 13px;
      font-family: inherit;
    }
    .filter-search:focus { outline: none; border-color: #F4D03F; }

    /* News grid */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 22px;
      margin-bottom: 48px;
    }
    .news-card {
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
      display: flex; flex-direction: column;
    }
    .news-card:hover {
      transform: translateY(-4px);
      border-color: rgba(244,208,63,.4);
      box-shadow: 0 18px 40px -16px rgba(244,208,63,.25);
    }
    .news-card-img {
      width: 100%; aspect-ratio: 16/10;
      background-size: cover; background-position: center;
      background-color: #1c2538;
      position: relative;
    }
    .news-card-cat {
      position: absolute; top: 12px; inset-inline-start: 12px;
      background: rgba(244,208,63,.95); color: #0a0e27;
      font-size: 10px; font-weight: 800; letter-spacing: .15em;
      padding: 4px 10px; border-radius: 999px;
      text-transform: uppercase;
    }
    .news-card-body { padding: 16px 18px 20px; flex: 1; display: flex; flex-direction: column; }
    .news-card-meta {
      font-size: 11px; color: rgba(255,255,255,.45);
      letter-spacing: .05em; margin-bottom: 8px;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .news-card-title {
      font-family: 'Cairo', 'Playfair Display', serif;
      font-weight: 800; font-size: 16px; color: #fff;
      line-height: 1.4; margin-bottom: 10px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .news-card-excerpt {
      font-size: 13px; color: rgba(255,255,255,.55);
      line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .news-card-cta {
      margin-top: auto;
      font-size: 13px; font-weight: 700; color: #F4D03F;
      display: inline-flex; align-items: center; gap: 6px;
    }

    /* Loading + empty */
    .news-loading, .news-empty {
      grid-column: 1 / -1;
      text-align: center; padding: 60px 24px;
      color: rgba(255,255,255,.55);
      font-size: 15px;
    }
    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.1); border-top-color: #F4D03F;
      animation: spin 1s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .load-more {
      grid-column: 1 / -1;
      text-align: center; margin-top: 12px;
    }
    .load-more-btn {
      background: transparent;
      border: 1px solid rgba(244,208,63,.4);
      color: #F4D03F; font-weight: 700;
      padding: 12px 28px; border-radius: 999px;
      cursor: pointer; font-size: 13px;
      font-family: inherit;
      transition: all .2s ease;
    }
    .load-more-btn:hover { background: rgba(244,208,63,.08); }

    /* Article modal (simple) */
    .article-overlay {
      position: fixed; inset: 0;
      background: rgba(10,8,6,.85);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: none;
      align-items: flex-start; justify-content: center;
      padding: 4vh 16px;
      overflow-y: auto;
    }
    .article-overlay.is-open { display: flex; }
    .article-paper {
      background: #11172e;
      color: #e6e9f0;
      width: 100%;
      max-width: 880px;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 40px 100px -40px rgba(0,0,0,.7);
    }
    .article-close {
      position: absolute; top: 14px; inset-inline-end: 14px;
      width: 38px; height: 38px;
      background: rgba(0,0,0,.5); border: 0;
      cursor: pointer; color: #fff;
      display: grid; place-items: center;
      border-radius: 50%; z-index: 10;
    }
    .article-hero {
      width: 100%;
      background-color: #1c2538;
    }
    .article-hero img {
      display: block; width: 100%; height: auto;
      max-height: 65vh; object-fit: contain; margin: 0 auto;
    }
    .article-brandbar { background:#000; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:5px; padding:12px 24px; }
    .article-brandbar .ab-wm { font-family:'Inter','Helvetica Neue',Arial,sans-serif; font-size:24px; font-weight:900; letter-spacing:-1px; color:#fff; line-height:1; }
    .article-brandbar .ab-sub { display:flex; align-items:center; gap:8px; }
    .article-brandbar .ab-sub span.line { height:1px; width:36px; background:rgba(255,255,255,.4); }
    .article-brandbar .ab-sub span.txt { font-size:8px; letter-spacing:4px; color:rgba(255,255,255,.85); font-weight:700; }
    .article-body { padding: 28px 32px 36px; }
    .article-meta { font-size: 12px; color: rgba(255,255,255,.5); margin-bottom: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
    .article-title { font-family: 'Cairo', 'Playfair Display', serif; font-weight: 900; font-size: 28px; color: #fff; line-height: 1.25; margin-bottom: 14px; }
    .article-excerpt { font-size: 16px; color: rgba(255,255,255,.75); line-height: 1.75; margin-bottom: 22px; }
    .article-share { display: flex; gap: 10px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.08); flex-wrap: wrap; }
    .share-btn { padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; }
    .share-btn:hover { background: rgba(244,208,63,.12); border-color: rgba(244,208,63,.4); }

    /* Footer */
    footer { padding: 32px 0; text-align: center; color: rgba(255,255,255,.4); font-size: 13px; border-top: 1px solid rgba(255,255,255,.06); margin-top: 64px; }
    footer a { color: #F4D03F; text-decoration: none; }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="container top-bar-inner">
      <a href="index.html" class="logo-link">
        <span class="logo-mark">▲</span>
        <span>
          <span class="logo-text">كايرو بيزنس</span>
          <span class="logo-sub">CAIRO BUSINESS</span>
        </span>
      </a>
      <a href="index.html" class="back-link">
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
        <span>الرئيسية</span>
      </a>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <div class="page-eyebrow">آخر التطورات الاقتصادية</div>
      <h1 class="page-title">كل الأخبار</h1>
      <p class="page-sub">تغطية فورية لأهم الأحداث الاقتصادية في مصر والشرق الأوسط — محدّثة كل 15 دقيقة.</p>
    </div>
  </section>

  <div class="container">
    <div class="filter-bar">
      <button class="filter-chip is-active" data-cat="all">الكل</button>
      <button class="filter-chip" data-cat="markets">الأسواق</button>
      <button class="filter-chip" data-cat="finance">المالية</button>
      <button class="filter-chip" data-cat="realestate">العقارات</button>
      <button class="filter-chip" data-cat="energy">الطاقة</button>
      <button class="filter-chip" data-cat="trade">التجارة</button>
      <button class="filter-chip" data-cat="technology">التكنولوجيا</button>
      <button class="filter-chip" data-cat="business">أعمال</button>
      <input class="filter-search" type="search" id="search-input" placeholder="ابحث في الأخبار..." />
    </div>

    <div class="news-grid" id="news-grid">
      <div class="news-loading">
        <div class="spinner"></div>
        <div>جاري تحميل آخر الأخبار...</div>
      </div>
    </div>
  </div>

  <!-- Article detail overlay -->
  <div class="article-overlay" id="article-overlay" onclick="if(event.target===this) closeArticle()">
    <article class="article-paper" id="article-paper">
      <button class="article-close" onclick="closeArticle()" aria-label="إغلاق"><i data-lucide="x" class="w-4 h-4"></i></button>
      <div class="article-hero" id="article-hero"></div>
      <div class="article-brandbar"><div class="ab-wm">Cairo Business</div><div class="ab-sub"><span class="line"></span><span class="txt">BUSINESS INTELLIGENCE</span><span class="line"></span></div></div>
      <div class="article-body">
        <div class="article-meta" id="article-meta"></div>
        <h2 class="article-title" id="article-title"></h2>
        <p class="article-excerpt" id="article-excerpt"></p>
        <div class="article-share">
          <button class="share-btn" onclick="shareTo('facebook')"><i data-lucide="facebook" class="w-3 h-3"></i> فيسبوك</button>
          <button class="share-btn" onclick="shareTo('twitter')"><i data-lucide="twitter" class="w-3 h-3"></i> تويتر</button>
          <button class="share-btn" onclick="shareTo('linkedin')"><i data-lucide="linkedin" class="w-3 h-3"></i> لينكدإن</button>
          <button class="share-btn" onclick="shareTo('whatsapp')"><i data-lucide="message-circle" class="w-3 h-3"></i> واتساب</button>
          <button class="share-btn" onclick="shareTo('copy')"><i data-lucide="copy" class="w-3 h-3"></i> نسخ الرابط</button>
        </div>
      </div>
    </article>
  </div>

  <footer>
    <div class="container">
      <a href="index.html">Cairo Business</a> · جميع الحقوق محفوظة © 2026 · <a href="about.html">عن الموقع</a> · <a href="contact.html">تواصل</a>
    </div>
  </footer>

  <script>
    let ALL_NEWS = [];
    let CURRENT_CAT = 'all';
    let CURRENT_SEARCH = '';
    let PAGE_SIZE = 24;
    let SHOWN = PAGE_SIZE;
    let CURRENT_ARTICLE = null;

    function timeAgo(iso) {
      if (!iso) return '';
      const t = new Date(iso).getTime();
      const diff = Date.now() - t;
      const m = Math.floor(diff / 60000);
      if (m < 60) return 'منذ ' + m + ' دقيقة';
      const h = Math.floor(m / 60);
      if (h < 24) return 'منذ ' + h + ' ساعة';
      const d = Math.floor(h / 24);
      if (d < 30) return 'منذ ' + d + ' يوم';
      return new Date(iso).toLocaleDateString('ar-EG', { day: '2-digit', month: 'short' });
    }

    const CAT_LABELS = {
      markets: 'الأسواق', finance: 'المالية', realestate: 'العقارات', energy: 'الطاقة',
      trade: 'التجارة', technology: 'التكنولوجيا', business: 'أعمال'
    };

    async function loadNews() {
      try {
        const res = await fetch('https://cairo-business-backend.vercel.app/api/news?limit=100', { cache: 'no-store' });
        const j = await res.json();
        ALL_NEWS = (j.data || []).map(n => ({ ...n }));
        renderGrid();
      } catch (e) {
        document.getElementById('news-grid').innerHTML = '<div class="news-empty">تعذر تحميل الأخبار. حاول لاحقاً.</div>';
      }
    }

    function getFiltered() {
      let list = ALL_NEWS.slice();
      if (CURRENT_CAT !== 'all') list = list.filter(n => (n.category || '').toLowerCase() === CURRENT_CAT);
      if (CURRENT_SEARCH) {
        const q = CURRENT_SEARCH.toLowerCase();
        list = list.filter(n =>
          (n.titleAr || '').toLowerCase().includes(q) ||
          (n.titleEn || '').toLowerCase().includes(q) ||
          (n.excerptAr || '').toLowerCase().includes(q)
        );
      }
      return list;
    }

    function renderGrid() {
      const grid = document.getElementById('news-grid');
      const list = getFiltered();
      if (!list.length) {
        grid.innerHTML = '<div class="news-empty">لا توجد أخبار تطابق الفلتر.</div>';
        return;
      }
      const visible = list.slice(0, SHOWN);
      const placeholder = 'https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=800&q=80';
      grid.innerHTML = visible.map(n => {
        const img = n.imageUrl && n.imageUrl.startsWith('http') ? n.imageUrl : placeholder;
        const cat = CAT_LABELS[n.category] || n.category || 'أعمال';
        const title = n.titleAr || n.titleEn || '';
        const excerpt = (n.excerptAr || n.excerptEn || '').replace(/</g, '&lt;');
        return '<article class="news-card" onclick="openArticle(' + JSON.stringify(n.id) + ')">' +
          '  <div class="news-card-img" style="background-image:url(\'' + img.replace(/\'/g, '%27') + '\')">' +
          '    <span class="news-card-cat">' + cat + '</span>' +
          '  </div>' +
          '  <div class="news-card-body">' +
          '    <div class="news-card-meta"><span>' + (n.author || 'فريق التحرير') + '</span><span>·</span><span>' + timeAgo(n.publishedAt || n.createdAt) + '</span></div>' +
          '    <h3 class="news-card-title">' + title + '</h3>' +
          '    <p class="news-card-excerpt">' + excerpt + '</p>' +
          '    <span class="news-card-cta">اقرأ التفاصيل <i data-lucide="arrow-left" class="w-3 h-3"></i></span>' +
          '  </div>' +
          '</article>';
      }).join('');
      if (list.length > visible.length) {
        grid.insertAdjacentHTML('beforeend', '<div class="load-more"><button class="load-more-btn" onclick="SHOWN += ' + PAGE_SIZE + '; renderGrid();">عرض المزيد (' + (list.length - visible.length) + ' متبقي)</button></div>');
      }
      if (window.lucide) lucide.createIcons();
    }

    function openArticle(id) {
      const n = ALL_NEWS.find(x => x.id === id);
      if (!n) return;
      CURRENT_ARTICLE = n;
      const img = n.imageUrl && n.imageUrl.startsWith('http') ? n.imageUrl : 'https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=1200&q=80';
      document.getElementById('article-hero').innerHTML = '<img src="' + img.replace(/"/g, '&quot;') + '" alt="" loading="lazy">';
      document.getElementById('article-title').textContent = n.titleAr || n.titleEn || '';
      document.getElementById('article-excerpt').textContent = n.excerptAr || n.excerptEn || '';
      document.getElementById('article-meta').innerHTML =
        '<span>' + (CAT_LABELS[n.category] || n.category || 'أعمال') + '</span>' +
        '<span>·</span><span>' + timeAgo(n.publishedAt || n.createdAt) + '</span>' +
        '<span>·</span><span>' + (n.author || 'فريق التحرير') + '</span>';
      const overlay = document.getElementById('article-overlay');
      overlay.classList.add('is-open');
      document.body.style.overflow = 'hidden';
      history.replaceState(null, '', 'news.html#' + encodeURIComponent(id));
      if (window.lucide) lucide.createIcons();
    }

    function closeArticle() {
      document.getElementById('article-overlay').classList.remove('is-open');
      document.body.style.overflow = '';
      if (location.hash) history.replaceState(null, '', 'news.html');
      CURRENT_ARTICLE = null;
    }

    function shareTo(channel) {
      if (!CURRENT_ARTICLE) return;
      /* /share/news/:id is rewritten on Vercel to backend OG endpoint — URL stays on cairobusiness.net */
      const shareUrl = 'https://cairobusiness.net/share/news/' + encodeURIComponent(CURRENT_ARTICLE.id);
      const title = CURRENT_ARTICLE.titleAr || CURRENT_ARTICLE.titleEn || '';
      let url = '';
      switch (channel) {
        case 'facebook': url = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(shareUrl); break;
        case 'twitter':  url = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(title) + '&url=' + encodeURIComponent(shareUrl); break;
        case 'linkedin': url = 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(shareUrl); break;
        case 'whatsapp': url = 'https://wa.me/?text=' + encodeURIComponent(title + '\n' + shareUrl); break;
        case 'copy':
          if (navigator.clipboard) navigator.clipboard.writeText(shareUrl).then(() => alert('تم نسخ الرابط ✓'));
          return;
      }
      if (url) window.open(url, '_blank', 'noopener,width=600,height=520');
    }

    /* Wire filter chips */
    document.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('is-active'));
        chip.classList.add('is-active');
        CURRENT_CAT = chip.dataset.cat;
        SHOWN = PAGE_SIZE;
        renderGrid();
      });
    });
    /* Wire search */
    document.getElementById('search-input').addEventListener('input', (e) => {
      CURRENT_SEARCH = e.target.value.trim();
      SHOWN = PAGE_SIZE;
      renderGrid();
    });
    /* Close on Escape */
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeArticle(); });

    /* Initialize */
    loadNews().then(() => {
      /* Auto-open article from hash */
      const m = location.hash.match(/^#(.+)$/);
      if (m) {
        const id = decodeURIComponent(m[1]);
        setTimeout(() => openArticle(id), 200);
      }
    });

    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
