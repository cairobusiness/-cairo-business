<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة التحكم — Cairo Business</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #0a0e1a; --card: #1a2238; --card-2: #22304d; --border: rgba(255,255,255,0.08); --border-2: rgba(255,255,255,0.15); --text: #f3f4f6; --text-2: #9ca3af; --text-3: #6b7280; --gold: #D4AF37; --gold-2: #b8941f; --green: #10b981; --red: #ef4444; --blue: #3b82f6; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Cairo','Inter',sans-serif;background:linear-gradient(135deg,#0a0e1a 0%,#111827 100%);color:var(--text);min-height:100vh;line-height:1.6}
    button{font-family:inherit;cursor:pointer;border:none;outline:none}
    input,textarea,select{font-family:inherit;background:var(--card-2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 14px;width:100%;font-size:14px}
    input:focus,textarea:focus,select:focus{border-color:var(--gold);background:rgba(212,175,55,0.05)}
    textarea{min-height:80px;resize:vertical}
    header{background:rgba(17,24,39,0.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
    .brand-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--gold),var(--gold-2));border-radius:8px;display:grid;place-items:center;color:#0a0e1a;font-weight:900;font-size:14px}
    .header-actions{display:flex;align-items:center;gap:16px}
    .user-chip{display:flex;align-items:center;gap:8px;padding:6px 14px;background:rgba(212,175,55,0.1);border:1px solid rgba(212,175,55,0.3);border-radius:9999px;font-size:13px}
    .btn{padding:9px 18px;border-radius:10px;font-weight:600;font-size:14px;transition:all 0.2s}
    .btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#0a0e1a}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(212,175,55,0.3)}
    .btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border-2)}
    .btn-ghost:hover{background:var(--card);color:var(--text)}
    .btn-danger{background:rgba(239,68,68,0.1);color:var(--red);border:1px solid rgba(239,68,68,0.3)}
    .btn-danger:hover{background:rgba(239,68,68,0.2)}
    .btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
    .container{max-width:1280px;margin:0 auto;padding:32px 24px}
    .login-screen{min-height:calc(100vh - 80px);display:grid;place-items:center;padding:24px}
    .login-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
    .login-card h1{font-size:22px;font-weight:800;margin-bottom:8px}
    .login-card p{color:var(--text-2);margin-bottom:24px;font-size:14px}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:600}
    .msg{padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:12px}
    .msg-error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5}
    .msg-success{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:#6ee7b7}
    .tabs{display:flex;gap:6px;padding:6px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:24px;overflow-x:auto}
    .tab{padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;color:var(--text-2);background:transparent;white-space:nowrap}
    .tab:hover{color:var(--text);background:var(--card-2)}
    .tab.active{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#0a0e1a}
    .tab-icon{margin-inline-end:6px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:16px;flex-wrap:wrap}
    .toolbar h2{font-size:24px;font-weight:800}
    .toolbar .actions{display:flex;gap:10px;align-items:center}
    .search-box{width:280px;padding:8px 12px;font-size:13px}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px}
    .stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
    .stat-label{color:var(--text-2);font-size:12px;margin-bottom:6px}
    .stat-value{font-size:24px;font-weight:800;color:var(--gold)}
    .item-grid{display:grid;gap:14px}
    .item-row{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
    .item-row:hover{border-color:var(--border-2)}
    .item-thumb{width:80px;height:80px;border-radius:10px;background:var(--card-2);display:grid;place-items:center;color:var(--text-3);font-size:30px;overflow:hidden}
    .item-thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px}
    .item-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--text-2);margin-bottom:6px}
    .pill{display:inline-block;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:600;background:rgba(212,175,55,0.1);color:var(--gold);border:1px solid rgba(212,175,55,0.3)}
    .pill-green{background:rgba(16,185,129,0.12);color:var(--green);border-color:rgba(16,185,129,0.3)}
    .pill-blue{background:rgba(59,130,246,0.12);color:var(--blue);border-color:rgba(59,130,246,0.3)}
    .item-title{font-size:16px;font-weight:700;margin-bottom:4px}
    .item-excerpt{color:var(--text-2);font-size:13px}
    .item-actions{display:flex;gap:8px;flex-shrink:0}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:48px 24px;overflow-y:auto}
    .modal-overlay.open{display:flex}
    .modal{background:var(--card);border:1px solid var(--border);border-radius:18px;width:100%;max-width:720px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,0.5)}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border)}
    .modal-header h3{font-size:20px;font-weight:800}
    .close-btn{width:32px;height:32px;border-radius:8px;background:var(--card-2);color:var(--text);display:grid;place-items:center;font-size:18px}
    .close-btn:hover{background:rgba(239,68,68,0.2);color:var(--red)}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .form-grid .field-full{grid-column:1 / -1}
    .modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}
    .checkbox-row{display:flex;align-items:center;gap:8px}
    .checkbox-row input{width:18px;height:18px;accent-color:var(--gold)}
    .empty-state{text-align:center;padding:60px 20px;color:var(--text-2)}
    .empty-state .icon{font-size:40px;margin-bottom:12px;opacity:0.5}
    .empty-state .title{font-size:16px;color:var(--text);margin-bottom:6px;font-weight:600}
    .loading{display:grid;place-items:center;padding:60px;color:var(--text-2)}
    .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-width:720px){.form-grid{grid-template-columns:1fr}.item-row{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:stretch}.search-box{width:100%}}

    /* ============== LIGHT THEME OVERRIDES ============== */
    html[data-theme="light"] {
      --bg: #f5f7fb; --card: #ffffff; --card-2: #f0f2f7;
      --border: rgba(0,0,0,0.08); --border-2: rgba(0,0,0,0.15);
      --text: #0f172a; --text-2: #475569; --text-3: #94a3b8;
    }
    html[data-theme="light"] body{background:linear-gradient(135deg,#f5f7fb 0%,#e9eef5 100%);color:#0f172a;}
    html[data-theme="light"] header{background:rgba(255,255,255,0.85);border-bottom:1px solid rgba(0,0,0,0.08);}
    html[data-theme="light"] input,html[data-theme="light"] textarea,html[data-theme="light"] select{background:#fff;border:1px solid rgba(0,0,0,0.12);color:#0f172a;}
    html[data-theme="light"] .login-card,html[data-theme="light"] .modal,html[data-theme="light"] .stat,html[data-theme="light"] .item-row,html[data-theme="light"] .tabs{background:#ffffff;border-color:rgba(0,0,0,0.08);}
    html[data-theme="light"] .item-thumb{background:#eef1f6;color:#94a3b8;}
    html[data-theme="light"] .tab{color:#475569;}
    html[data-theme="light"] .tab:hover{background:rgba(0,0,0,0.04);}
    html[data-theme="light"] .close-btn{background:#eef1f6;color:#0f172a;}

    .theme-btn{position:relative;cursor:pointer;border:1px solid var(--border-2);background:transparent;color:var(--text-2);padding:6px 12px;border-radius:8px;font-size:12px;display:inline-flex;align-items:center;gap:6px;}
    .theme-btn:hover{color:var(--text);border-color:var(--gold);}

    /* ============== SEO section in news editor ============== */
    .seo-collapse{margin-top:14px;border:1px dashed var(--border-2);border-radius:10px;}
    .seo-collapse summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:13px;color:var(--gold);}
    .seo-collapse[open] summary{border-bottom:1px solid var(--border);}
    .seo-collapse .form-grid{padding:14px;}
    .seo-score{display:inline-block;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:700;margin-inline-start:8px;}
    .seo-score.good{background:rgba(16,185,129,0.12);color:#10b981;}
    .seo-score.warn{background:rgba(245,158,11,0.12);color:#f59e0b;}
    .seo-score.bad{background:rgba(239,68,68,0.12);color:#ef4444;}

    /* Quill rich-text editor styling (for full-article modal) */
    .ql-toolbar.ql-snow,
    .ql-container.ql-snow{ border-color:rgba(255,255,255,0.15) !important; background:rgba(255,255,255,0.03); }
    .ql-editor{ min-height:240px; color:inherit; font-family:'Cairo','Inter',sans-serif; font-size:14px; line-height:1.8; direction:rtl; text-align:right; }
    .ql-editor.ql-blank::before{ color:rgba(255,255,255,0.35); right:15px; left:auto; font-style:normal; }
    .ql-snow .ql-stroke{ stroke:rgba(255,255,255,0.7); }
    .ql-snow .ql-picker{ color:rgba(255,255,255,0.7); }
    .ql-snow.ql-toolbar button:hover .ql-stroke,
    .ql-snow .ql-toolbar button:hover .ql-stroke{ stroke:#F4D03F; }
    .ql-snow.ql-toolbar .ql-active .ql-stroke{ stroke:#F4D03F; }

    /* Full-article modal */
    .article-modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(6px); z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px; }
    .article-modal{ background:#0e1230; border:1px solid rgba(255,255,255,0.1); border-radius:16px; max-width:920px; width:100%; max-height:92vh; overflow-y:auto; padding:24px; box-shadow:0 30px 60px -20px rgba(0,0,0,0.6); }
    .article-modal h2{ margin:0 0 16px; color:#F4D03F; font-size:18px; }
    .am-field{ display:block; margin-bottom:14px; }
    .am-field label{ display:block; font-size:12px; color:rgba(255,255,255,0.7); margin-bottom:5px; font-weight:600; }
    .am-field input, .am-field textarea, .am-field select{ width:100%; padding:9px 12px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:inherit; font-family:inherit; font-size:13px; }
    .am-field textarea{ min-height:60px; resize:vertical; }
    .am-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .am-tags{ display:flex; flex-wrap:wrap; gap:6px; padding:6px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:8px; min-height:40px; }
    .am-tag{ background:rgba(244,208,63,0.15); color:#F4D03F; padding:3px 10px; border-radius:9999px; font-size:12px; display:inline-flex; align-items:center; gap:5px; }
    .am-tag .x{ cursor:pointer; opacity:0.6; }
    .am-tag .x:hover{ opacity:1; color:#ef4444; }
    .am-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:18px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.08); flex-wrap:wrap; }
  </style>

<body>

    <div class="brand"><div class="brand-mark">CB</div><span>لوحة تحكم Cairo Business</span></div>
    <div class="header-actions">
      <button class="theme-btn" onclick="toggleAdminTheme()" id="theme-btn" title="تبديل الوضع الفاتح/الداكن">🌙 <span id="theme-label">داكن</span></button>
      <div class="user-chip" id="user-chip"><span id="user-name">—</span><span id="user-role-chip" style="margin-inline-start:6px;font-size:10px;opacity:.7;"></span></div>
      <button class="btn btn-ghost btn-sm" onclick="logout()">خروج</button>
    </div>
  </header>
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h1>🔐 لوحة التحكم</h1>

      <div id="login-msg"></div>

  <div id="app" class="container" style="display:none;">
    <div class="tabs" id="tabs"></div>

      <h2 id="page-title">—</h2>
      <div class="actions">
        <input class="search-box" id="search-input" type="text" placeholder="ابحث..." oninput="onSearch()" />
        <button class="btn btn-primary" onclick="openCreateModal()">+ <span id="create-label">جديد</span></button>

  <script src="admin-app.js"></script>
  <!-- ============================================================
       PATCH v2 — fixes from May 25, 2026
       1. uploadFileFor: client-side base64 fallback when Supabase
          Storage env vars aren't configured (returns 503).
       2. optimizeImage: ensure function exists even if main file
          is truncated.
       ============================================================ -->
  <script>
  (function () {
    /* ---------- Client-side image optimization (canvas resize + jpeg) ---------- */
    async function _optimizeImage(file, maxW, maxH, quality) {
      maxW = maxW || 1600; maxH = maxH || 900; quality = quality || 0.82;
      const dataUrl = await new Promise(function (res, rej) {
        const fr = new FileReader();
        fr.onload = function () { res(fr.result); };
        fr.onerror = rej;
        fr.readAsDataURL(file);
      });
      const img = await new Promise(function (res, rej) {
        const i = new Image();
        i.onload = function () { res(i); };
        i.onerror = rej;
        i.src = dataUrl;
      });
      let w = img.width, h = img.height;
      if (w > maxW || h > maxH) {
        const r = Math.min(maxW / w, maxH / h);
        w = Math.round(w * r);
        h = Math.round(h * r);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0a0e1a';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const finalDataUrl = canvas.toDataURL('image/jpeg', quality);
      const sizeKB = Math.round(finalDataUrl.length * 0.75 / 1024);
      return { dataUrl: finalDataUrl, width: w, height: h, sizeKB: sizeKB };
    }
    window.optimizeImage = _optimizeImage;

    /* ---------- Find the URL input next to the file picker ---------- */
    function _findTargetInput(fieldId) {
      /* admin-app.js convention: form inputs are id="f_<fieldId>" */
      let el = document.getElementById('f_' + fieldId);
      if (el) return el;
      /* Fallback: plain id match */
      el = document.getElementById(fieldId);
      if (el) return el;
      /* Last resort: look near the up_<fieldId> file picker */
      const fileInput = document.getElementById('up_' + fieldId);
      if (fileInput) {
        const wrap = fileInput.closest('.field, .form-field, td, div');
        if (wrap) {
          const i = wrap.querySelector('input[type="url"], input[type="text"], textarea');
          if (i) return i;
        }
      }
      return null;
    }

    /* ---------- The actual upload entry point used by all picker buttons ---------- */
    async function _uploadFileFor(fieldId, inputEl) {
      const file = inputEl && inputEl.files && inputEl.files[0];
      if (!file) return;
      const targetInput = _findTargetInput(fieldId);
      if (!targetInput) {
        alert('لم يتم العثور على حقل URL للحفظ.');
        return;
      }
      /* Find/create status indicator */
      let status = document.getElementById('up-status-' + fieldId);
      if (!status) {
        status = document.createElement('div');
        status.id = 'up-status-' + fieldId;
        status.style.cssText = 'font-size:11px;margin-top:4px;color:var(--text-2);';
        inputEl.parentNode && inputEl.parentNode.appendChild(status);
      }
      status.style.color = 'var(--gold)';
      status.textContent = '⏳ جاري الضغط والمعالجة...';

      try {
        /* 1) Always compress the image client-side first (saves bandwidth & space) */
        const opt = await _optimizeImage(file, 1600, 1200, 0.85);

        /* 2) Try uploading to Supabase via /api/admin/upload */
        let uploaded = null;
        try {
          /* Convert dataURL back to Blob for upload */
          const parts = opt.dataUrl.split(',');
          const b64 = parts[1] || '';
          const bin = atob(b64);
          const arr = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          const blob = new Blob([arr], { type: 'image/jpeg' });

          const fd = new FormData();
          fd.append('file', blob, (file.name || 'image').replace(/\.[^.]+$/, '') + '.jpg');
          const token = (typeof getToken === 'function' ? getToken() : null) || localStorage.getItem('cb_auth_token') || '';
          const headers = {};
          if (token) headers['Authorization'] = 'Bearer ' + token;
          const r = await fetch('https://cairo-business-backend.vercel.app/api/admin/upload', {
            method: 'POST',
            headers: headers,
            body: fd
          });
          if (r.ok) {
            const j = await r.json();
            if (j && j.success && j.url) uploaded = j.url;
          }
          /* If 503 (storage not configured) or any failure → fall back to base64 below */
        } catch (e) { /* fall back to base64 */ }

        /* 3) Use Supabase URL if available, otherwise embed base64 directly */
        const finalValue = uploaded || opt.dataUrl;

        targetInput.value = finalValue;
        targetInput.dispatchEvent(new Event('input', { bubbles: true }));
        targetInput.dispatchEvent(new Event('change', { bubbles: true }));

        status.style.color = 'var(--green)';
        status.textContent = (uploaded
          ? '✓ تم رفع الصورة على السحابة'
          : '✓ تم تخزين الصورة (' + opt.width + '×' + opt.height + ', ' + opt.sizeKB + 'KB)');

        /* Update an adjacent preview if one exists */
        const prev = document.getElementById(fieldId + '-preview');
        if (prev) {
          prev.innerHTML = '<img src="' + finalValue + '" style="max-width:200px;max-height:120px;border-radius:8px;border:1px solid var(--border);margin-top:6px;" />';
        }
      } catch (err) {
        console.error('uploadFileFor failed:', err);
        status.style.color = 'var(--red)';
        status.textContent = '✗ فشل المعالجة: ' + (err && err.message || 'unknown');
      } finally {
        /* Reset input so the same file can be re-selected later */
        try { inputEl.value = ''; } catch (_) {}
      }
    }
    /* Expose globally — overrides any earlier definition */
    window.uploadFileFor = _uploadFileFor;

    /* ============================================================
       PREVIEW MODAL — opens the current entity form data in a styled
       preview window before publish. Works for news + content blocks
       + any entity that has imageUrl/title/excerpt/body fields.
       ============================================================ */
    function _collectFormData() {
      const data = {};
      document.querySelectorAll('[id^="f_"]').forEach((el) => {
        const key = el.id.slice(2);
        if (el.type === 'checkbox') data[key] = el.checked;
        else data[key] = el.value;
      });
      /* Pull rich-text Quill content if present */
      try {
        const quillRoot = document.querySelector('.ql-editor');
        if (quillRoot) data.body = quillRoot.innerHTML;
      } catch (_) {}
      return data;
    }

    function _previewHtml(d) {
      const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const title = d.titleAr || d.title || d.headline || d.name || '(بدون عنوان)';
      const excerpt = d.excerptAr || d.excerpt || d.subtitle || d.description || '';
      const body = d.body || d.contentAr || d.content || '';
      const img = d.imageUrl || d.image || d.thumbnail || '';
      const category = d.category || d.tag || d.section || '';
      const author = d.author || 'فريق التحرير';
      const now = new Date().toLocaleDateString('ar-EG', { year:'numeric', month:'long', day:'numeric' });
      return ''
        + '<div style="max-width:780px;margin:0 auto;font-family:Cairo,Arial,sans-serif;color:#fff;">'
        + (img ? '<div style="width:100%;height:340px;background:url(' + esc(img) + ') center/cover no-repeat;border-radius:16px;margin-bottom:24px;border:1px solid rgba(255,255,255,.1);"></div>' : '')
        + '<div style="display:flex;gap:12px;font-size:12px;color:rgba(255,255,255,.6);margin-bottom:14px;flex-wrap:wrap;">'
        +   (category ? '<span style="background:rgba(244,208,63,.15);color:#F4D03F;border:1px solid rgba(244,208,63,.3);padding:4px 12px;border-radius:9999px;font-weight:700;">' + esc(category) + '</span>' : '')
        +   '<span>•</span><span>' + esc(now) + '</span>'
        +   '<span>•</span><span>' + esc(author) + '</span>'
        + '</div>'
        + '<h1 style="font-size:32px;font-weight:900;line-height:1.3;margin-bottom:18px;color:#fff;">' + esc(title) + '</h1>'
        + (excerpt ? '<p style="font-size:17px;line-height:1.7;color:rgba(255,255,255,.75);margin-bottom:22px;font-style:italic;border-inline-start:3px solid #F4D03F;padding-inline-start:14px;">' + esc(excerpt) + '</p>' : '')
        + '<div style="font-size:16px;line-height:1.9;color:rgba(255,255,255,.88);">'
        +   (body && /<[a-z][\s\S]*>/i.test(body) ? body : '<p>' + esc(body).replace(/\n\n+/g, '</p><p>').replace(/\n/g, '<br>') + '</p>')
        + '</div>'
        + '<div style="margin-top:30px;padding-top:18px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:rgba(255,255,255,.5);text-align:center;">'
        +   '🔍 معاينة فقط — لم يتم النشر بعد'
        + '</div>'
        + '</div>';
    }

    function openCBPreview() {
      const data = _collectFormData();
      let overlay = document.getElementById('cb-preview-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'cb-preview-overlay';
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(2,6,23,.92);backdrop-filter:blur(10px);z-index:99999;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;';
        overlay.innerHTML = '<div style="background:linear-gradient(155deg,#0f1a3d 0%,#0a0e27 100%);border:1px solid rgba(212,175,55,.3);border-radius:20px;padding:34px 36px;max-width:860px;width:100%;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.7);">'
          + '<button onclick="closeCBPreview()" style="position:absolute;top:14px;inset-inline-end:14px;width:38px;height:38px;border-radius:50%;background:rgba(10,14,39,.85);border:1px solid rgba(255,255,255,.18);color:#fff;cursor:pointer;font-size:22px;">×</button>'
          + '<div id="cb-preview-body"></div>'
          + '</div>';
        overlay.addEventListener('click', (e) => { if (e.target === overlay) closeCBPreview(); });
        document.body.appendChild(overlay);
      }
      document.getElementById('cb-preview-body').innerHTML = _previewHtml(data);
      overlay.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }
    function closeCBPreview() {
      const o = document.getElementById('cb-preview-overlay');
      if (o) o.style.display = 'none';
      document.body.style.overflow = '';
    }
    window.openCBPreview = openCBPreview;
    window.closeCBPreview = closeCBPreview;

    /* Auto-inject a "معاينة" button next to the Save button whenever the
       create/edit modal opens. */
    function _injectPreviewBtn() {
      const saveBtn = document.getElementById('save-btn') || document.querySelector('.modal-footer .btn-primary');
      if (!saveBtn || document.getElementById('cb-preview-btn')) return;
      const btn = document.createElement('button');
      btn.id = 'cb-preview-btn';
      btn.type = 'button';
      btn.className = 'btn btn-ghost';
      btn.innerHTML = '👁️ معاينة';
      btn.style.cssText = 'margin-inline-end:8px;';
      btn.onclick = openCBPreview;
      saveBtn.parentNode.insertBefore(btn, saveBtn);
    }
    /* Watch for modal open to inject the button */
    const _modalObserver = new MutationObserver(() => { _injectPreviewBtn(); _injectImageUrlField(); });
    try {
      const modal = document.getElementById('item-modal');
      if (modal) _modalObserver.observe(modal, { attributes: true, childList: true, subtree: true });
    } catch (_) {}
    /* Initial pass in case modal is already in DOM */
    document.addEventListener('DOMContentLoaded', _injectPreviewBtn);
    setTimeout(_injectPreviewBtn, 600);

    /* ============================================================
       AUTO-INJECT IMAGE UPLOAD field for entities whose form doesn't
       already have one. Targets: realestate, deals, startups, events.
       These DB tables now have imageUrl column (added by migrate-imageurl).
       ============================================================ */
    function _currentEntityKey() {
      const t = document.querySelector('.tab.active');
      const onclick = t && t.getAttribute('onclick');
      const m = onclick && onclick.match(/'([^']+)'/);
      return m ? m[1] : '';
    }
    function _injectImageUrlField() {
      const modal = document.getElementById('item-modal');
      if (!modal || !modal.classList.contains('open')) return;
      /* Skip if there's already an imageUrl field (or any URL field already wired with upload) */
      if (document.getElementById('f_imageUrl')) return;
      const grid = document.getElementById('form-fields');
      if (!grid) return;
      /* Only inject for the 4 entities that don't have built-in image field */
      const key = _currentEntityKey();
      const eligible = ['realestate', 'deals', 'startups', 'events'];
      if (!eligible.includes(key)) return;
      /* Pre-populate from currently edited item (if any) */
      const existing = (window.__currentItem && (window.__currentItem.imageUrl || ''));
      /* Build the field — same structure used by admin-app.js for url fields */
      const wrap = document.createElement('div');
      wrap.className = 'field field-full';
      wrap.id = 'auto-imageurl-wrap';
      wrap.innerHTML =
        '<label>🖼️ صورة الغلاف (اختياري)</label>'
        + '<input id="f_imageUrl" type="url" dir="ltr" value="' + (existing || '').replace(/"/g, '&quot;') + '" placeholder="https://..." />'
        + '<div class="upload-widget" style="display:flex;gap:6px;align-items:center;margin-top:6px;font-size:11px;">'
        +   '<input type="file" id="up_imageUrl" accept="image/*" style="display:none" onchange="uploadFileFor(\'imageUrl\', this)" />'
        +   '<button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById(\'up_imageUrl\').click()">📤 رفع صورة من جهازك</button>'
        +   '<span id="upstatus_imageUrl" style="font-size:11px;opacity:0.7;"></span>'
        + '</div>';
      /* Insert near the top of the form for visibility */
      grid.insertBefore(wrap, grid.firstChild);
    }

    /* ============================================================
       SET-IMAGEURL HOOK — wraps `api()` so that after a successful
       POST/PUT to /api/admin/{realestate,deals,startups,events}
       we follow up with /api/admin/set-imageurl to persist the
       imageUrl (since those endpoints don't accept it natively yet).
       ============================================================ */
    (function wrapApi() {
      if (typeof window.api !== 'function') {
        setTimeout(wrapApi, 200);
        return;
      }
      const origApi = window.api;
      const targets = /\/api\/admin\/(realestate|deals|startups|events)(\/[^?]+)?$/;
      window.api = async function (path, options) {
        const result = await origApi(path, options);
        try {
          const m = path && path.match(targets);
          if (!m || !options || !['POST', 'PUT', 'PATCH'].includes((options.method || '').toUpperCase())) return result;
          if (!result || !result.ok || !result.data) return result;
          /* Find the imageUrl that was in the body */
          let body = {};
          try { body = options.body ? JSON.parse(options.body) : {}; } catch (_) {}
          if (!body.imageUrl) return result;
          const entityKey = m[1];
          const id = (result.data.data && result.data.data.id) || (result.data.id);
          if (!id) return result;
          /* Persist imageUrl via the dedicated endpoint */
          await origApi('/api/admin/set-imageurl', {
            method: 'POST',
            body: JSON.stringify({ entity: entityKey, id: id, imageUrl: body.imageUrl })
          });
        } catch (e) { console.warn('imageUrl post-save failed:', e); }
        return result;
      };
    })();
  })();
  </script>
</body>
