<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة التحكم — Cairo Business</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #0a0e1a; --card: #1a2238; --card-2: #22304d; --border: rgba(255,255,255,0.08); --border-2: rgba(255,255,255,0.15); --text: #f3f4f6; --text-2: #9ca3af; --text-3: #6b7280; --gold: #D4AF37; --gold-2: #b8941f; --green: #10b981; --red: #ef4444; --blue: #3b82f6; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Cairo','Inter',sans-serif;background:linear-gradient(135deg,#0a0e1a 0%,#111827 100%);color:var(--text);min-height:100vh;line-height:1.6}
    button{font-family:inherit;cursor:pointer;border:none;outline:none}
    input,textarea,select{font-family:inherit;background:var(--card-2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 14px;width:100%;font-size:14px}
    input:focus,textarea:focus,select:focus{border-color:var(--gold);background:rgba(212,175,55,0.05)}
    textarea{min-height:80px;resize:vertical}
    header{background:rgba(17,24,39,0.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
    .brand-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--gold),var(--gold-2));border-radius:8px;display:grid;place-items:center;color:#0a0e1a;font-weight:900;font-size:14px}
    .header-actions{display:flex;align-items:center;gap:16px}
    .user-chip{display:flex;align-items:center;gap:8px;padding:6px 14px;background:rgba(212,175,55,0.1);border:1px solid rgba(212,175,55,0.3);border-radius:9999px;font-size:13px}
    .btn{padding:9px 18px;border-radius:10px;font-weight:600;font-size:14px;transition:all 0.2s}
    .btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#0a0e1a}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(212,175,55,0.3)}
    .btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border-2)}
    .btn-ghost:hover{background:var(--card);color:var(--text)}
    .btn-danger{background:rgba(239,68,68,0.1);color:var(--red);border:1px solid rgba(239,68,68,0.3)}
    .btn-danger:hover{background:rgba(239,68,68,0.2)}
    .btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
    .container{max-width:1280px;margin:0 auto;padding:32px 24px}
    .login-screen{min-height:calc(100vh - 80px);display:grid;place-items:center;padding:24px}
    .login-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
    .login-card h1{font-size:22px;font-weight:800;margin-bottom:8px}
    .login-card p{color:var(--text-2);margin-bottom:24px;font-size:14px}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:600}
    .msg{padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:12px}
    .msg-error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5}
    .msg-success{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:#6ee7b7}
    .tabs{display:flex;gap:6px;padding:6px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:24px;overflow-x:auto}
    .tab{padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;color:var(--text-2);background:transparent;white-space:nowrap}
    .tab:hover{color:var(--text);background:var(--card-2)}
    .tab.active{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#0a0e1a}
    .tab-icon{margin-inline-end:6px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:16px;flex-wrap:wrap}
    .toolbar h2{font-size:24px;font-weight:800}
    .toolbar .actions{display:flex;gap:10px;align-items:center}
    .search-box{width:280px;padding:8px 12px;font-size:13px}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px}
    .stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
    .stat-label{color:var(--text-2);font-size:12px;margin-bottom:6px}
    .stat-value{font-size:24px;font-weight:800;color:var(--gold)}
    .item-grid{display:grid;gap:14px}
    .item-row{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
    .item-row:hover{border-color:var(--border-2)}
    .item-thumb{width:80px;height:80px;border-radius:10px;background:var(--card-2);display:grid;place-items:center;color:var(--text-3);font-size:30px;overflow:hidden}
    .item-thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px}
    .item-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--text-2);margin-bottom:6px}
    .pill{display:inline-block;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:600;background:rgba(212,175,55,0.1);color:var(--gold);border:1px solid rgba(212,175,55,0.3)}
    .pill-green{background:rgba(16,185,129,0.12);color:var(--green);border-color:rgba(16,185,129,0.3)}
    .pill-blue{background:rgba(59,130,246,0.12);color:var(--blue);border-color:rgba(59,130,246,0.3)}
    .item-title{font-size:16px;font-weight:700;margin-bottom:4px}
    .item-excerpt{color:var(--text-2);font-size:13px}
    .item-actions{display:flex;gap:8px;flex-shrink:0}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:48px 24px;overflow-y:auto}
    .modal-overlay.open{display:flex}
    .modal{background:var(--card);border:1px solid var(--border);border-radius:18px;width:100%;max-width:720px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,0.5)}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border)}
    .modal-header h3{font-size:20px;font-weight:800}
    .close-btn{width:32px;height:32px;border-radius:8px;background:var(--card-2);color:var(--text);display:grid;place-items:center;font-size:18px}
    .close-btn:hover{background:rgba(239,68,68,0.2);color:var(--red)}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .form-grid .field-full{grid-column:1 / -1}
    .modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}
    .checkbox-row{display:flex;align-items:center;gap:8px}
    .checkbox-row input{width:18px;height:18px;accent-color:var(--gold)}
    .empty-state{text-align:center;padding:60px 20px;color:var(--text-2)}
    .empty-state .icon{font-size:40px;margin-bottom:12px;opacity:0.5}
    .empty-state .title{font-size:16px;color:var(--text);margin-bottom:6px;font-weight:600}
    .loading{display:grid;place-items:center;padding:60px;color:var(--text-2)}
    .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-width:720px){.form-grid{grid-template-columns:1fr}.item-row{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:stretch}.search-box{width:100%}}
  </style>
</head>
<body>
  <header id="app-header" style="display:none;">
    <div class="brand"><div class="brand-mark">CB</div><span>لوحة تحكم Cairo Business</span></div>
    <div class="header-actions"><div class="user-chip" id="user-chip"><span id="user-name">—</span></div><button class="btn btn-ghost btn-sm" onclick="logout()">خروج</button></div>
  </header>
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h1>🔐 لوحة التحكم</h1>
      <p>سجّل دخول بحساب الأدمن للوصول إلى لوحة التحكم.</p>
      <div id="login-msg"></div>
      <div class="field"><label>البريد الإلكتروني</label><input id="login-email" type="email" placeholder="admin@cairobusiness.net" autocomplete="email" /></div>
      <div class="field"><label>كلمة المرور</label><input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" /></div>
      <button class="btn btn-primary" style="width:100%;" id="login-btn" onclick="doLogin()">تسجيل الدخول</button>
    </div>
  </div>
  <div id="app" class="container" style="display:none;">
    <div class="tabs" id="tabs"></div>
    <div class="stats" id="stats-section"></div>
    <div class="toolbar">
      <h2 id="page-title">—</h2>
      <div class="actions">
        <input class="search-box" id="search-input" type="text" placeholder="ابحث..." oninput="onSearch()" />
        <button class="btn btn-primary" onclick="openCreateModal()">+ <span id="create-label">جديد</span></button>
      </div>
    </div>
    <div id="list-container"><div class="loading"><div class="spinner"></div></div></div>
  </div>
  <div class="modal-overlay" id="item-modal">
    <div class="modal">
      <div class="modal-header"><h3 id="modal-title">جديد</h3><button class="close-btn" onclick="closeModal()">×</button></div>
      <div id="modal-msg"></div>
      <div class="form-grid" id="form-fields"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
        <button class="btn btn-primary" id="save-btn" onclick="saveItem()">حفظ</button>
      </div>
    </div>
  </div>
  <script src="admin-app.js"></script>
</body>
</html>
