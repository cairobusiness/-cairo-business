<!doctype html> <html lang="ar" dir="rtl"> <head>   <meta charset="utf-8" />   <meta name="viewport" content="width=device-width, initial-scale=1" />   <title>تفاصيل الفرصة — Cairo Business</title>   <meta name="description" content="تفاصيل الفرصة الاستثمارية على Cairo Business." />   <meta name="robots" content="index, follow" />   <link rel="preconnect" href="https://fonts.googleapis.com" />   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />   <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />   <style>     :root{ --bg:#0a0e27; --bg-2:#060818; --card:rgba(255,255,255,0.04); --border:rgba(255,255,255,0.10); --text:#fff; --text-2:rgba(255,255,255,0.85); --text-3:rgba(255,255,255,0.55); --gold:#e6c97a; --gold-2:#d4af37; }     *{box-sizing:border-box;margin:0;padding:0}     body{font-family:'Cairo','Tajawal','Inter',sans-serif;background:linear-gradient(180deg,#060818 0%,#0a0e27 100%);color:var(--text);min-height:100vh;line-height:1.6}     a{color:var(--gold);text-decoration:none;transition:opacity .2s}     a:hover{opacity:.75}     .topbar{background:rgba(10,14,39,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:18px 24px;display:flex;align-items:center;justify-content:space-between}     .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:#fff}     .brand-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--gold),var(--gold-2));border-radius:8px;display:grid;place-items:center;font-weight:900;color:#0a0e27}     .topnav a{color:var(--text-2);margin-inline-start:24px;font-size:14px}     .topnav a:hover{color:#fff}     .container{max-width:880px;margin:0 auto;padding:56px 24px}     .eyebrow{font-size:11px;font-weight:700;letter-spacing:.3em;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}     .hot-badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(239,68,68,0.18);color:#ef4444}     .deal-title{font-family:'Cairo',serif;font-size:42px;font-weight:900;line-height:1.15;color:#fff;margin-bottom:14px}     .type-pill{display:inline-block;font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;background:rgba(230,201,122,0.15);color:var(--gold);border:1px solid rgba(230,201,122,0.30);margin-bottom:20px}     .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:32px 0;padding:24px;background:var(--card);border:1px solid var(--border);border-radius:14px}     .meta-item .meta-label{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--text-3);margin-bottom:6px;text-transform:uppercase}     .meta-item .meta-value{font-size:18px;font-weight:700;color:#fff}     .meta-item.value .meta-value{color:var(--gold);font-size:22px}     .section{margin-top:36px}     .section h2{font-size:13px;font-weight:700;letter-spacing:.25em;color:var(--gold);text-transform:uppercase;margin-bottom:14px}     .description{font-size:17px;line-height:1.85;color:var(--text-2);white-space:pre-wrap}     .contact-box{margin-top:48px;padding:32px;background:linear-gradient(135deg,rgba(230,201,122,0.10),rgba(230,201,122,0.04));border:1px solid rgba(230,201,122,0.25);border-radius:18px;text-align:center}     .contact-box h3{font-size:22px;font-weight:800;color:#fff;margin-bottom:8px}     .contact-box p{color:var(--text-3);font-size:14px;margin-bottom:20px}     .contact-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}     .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:12px;font-weight:700;font-size:15px;transition:transform .15s,box-shadow .15s;border:1px solid transparent}     .btn-primary{background:var(--gold);color:#0a0e27;border-color:var(--gold)}     .btn-primary:hover{opacity:1;transform:translateY(-2px);box-shadow:0 10px 30px rgba(230,201,122,0.35)}     .btn-outline{background:transparent;color:var(--gold);border-color:rgba(230,201,122,0.45)}     .btn-outline:hover{background:rgba(230,201,122,0.08);opacity:1}     .footer{padding:24px;border-top:1px solid var(--border);text-align:center;color:var(--text-3);font-size:13px;margin-top:60px}     .footer a{margin:0 8px}     .loading,.error{padding:60px 24px;text-align:center;color:var(--text-3);font-size:16px}     .error{color:#ef4444}     @media (max-width:640px){       .container{padding:32px 20px}       .deal-title{font-size:30px}       .contact-box{padding:24px}     }   </style> </head> <body>   <div class="topbar">     <a href="/" class="brand"><span class="brand-mark">▲</span> Cairo Business</a>     <nav class="topnav">       <a href="/">الرئيسية</a>       <a href="/about.html">من نحن</a>       <a href="/contact.html">اتصل بنا</a>     </nav>   </div>    <main class="container" id="deal-root">     <div class="loading">⏳ جاري تحميل تفاصيل الفرصة...</div>   </main>    <footer class="footer">     <div class="copyright">© 2026 Cairo Business Media. كل الحقوق محفوظة.</div>   </footer>    <script>   (function(){     var root = document.getElementById('deal-root');     var sp = new URLSearchParams(location.search);     var id = sp.get('id');     var isAr = (document.documentElement.lang || 'ar') === 'ar';     var BACKEND = 'https://cairo-business-backend.vercel.app';      function escapeHtml(s){       if (s == null) return '';       return String(s).replace(/[&<>"']/g, function(c){         return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];       });     }      if (!id) {       root.innerHTML = '<div class="error">⚠️ معرّف الفرصة غير موجود في الرابط.</div>';       return;     }      function load(){       fetch(BACKEND + '/api/deals?limit=100')         .then(function(r){ return r.json(); })         .then(function(j){           var list = (j && j.data) ? j.data : (Array.isArray(j) ? j : []);           var d = list.find(function(x){ return x.id === id; });           if (!d) {             root.innerHTML = '<div class="error">⚠️ الفرصة غير موجودة أو تمت إزالتها.</div>';             document.title = 'فرصة غير موجودة — Cairo Business';             return;           }           render(d);         })         .catch(function(){           root.innerHTML = '<div class="error">⚠️ تعذّر تحميل تفاصيل الفرصة. حاول مرة أخرى لاحقاً.</div>';         });     }      function render(d){       var title    = isAr ? (d.titleAr || d.titleEn || '') : (d.titleEn || d.titleAr || '');       var titleAlt = isAr ? (d.titleEn || '') : (d.titleAr || '');       var type     = d.type || '';       var location = isAr ? (d.locationAr || d.locationEn || '') : (d.locationEn || d.locationAr || '');       var value    = (d.value != null) ? ('$' + d.value + 'M') : '';       var deadline = d.deadline ? new Date(d.deadline).toLocaleDateString(isAr ? 'ar-EG' : 'en-US', {year:'numeric', month:'long', day:'numeric'}) : '';       var desc     = isAr ? (d.descriptionAr || d.descriptionEn || '') : (d.descriptionEn || d.descriptionAr || '');       var hot      = !!d.isHot;       var status   = d.status || '';        document.title = (title || 'تفاصيل الفرصة') + ' — Cairo Business';        var html = ''         + '<div class="eyebrow">فرصة استثمارية' + (hot ? ' <span class="hot-badge">🔥 ساخنة</span>' : '') + '</div>'         + (type ? '<div class="type-pill">' + escapeHtml(type) + '</div>' : '')         + '<h1 class="deal-title">' + escapeHtml(title) + '</h1>'         + (titleAlt && titleAlt !== title ? '<div style="color:var(--text-3);font-size:18px;margin-top:-6px;margin-bottom:16px;">' + escapeHtml(titleAlt) + '</div>' : '')         + '<div class="meta-grid">'           + (value ? '<div class="meta-item value"><div class="meta-label">القيمة</div><div class="meta-value">' + escapeHtml(value) + '</div></div>' : '')           + (location ? '<div class="meta-item"><div class="meta-label">الموقع</div><div class="meta-value">' + escapeHtml(location) + '</div></div>' : '')           + (deadline ? '<div class="meta-item"><div class="meta-label">آخر موعد</div><div class="meta-value">' + escapeHtml(deadline) + '</div></div>' : '')           + (status ? '<div class="meta-item"><div class="meta-label">الحالة</div><div class="meta-value">' + escapeHtml(status) + '</div></div>' : '')         + '</div>'         + (desc ? '<div class="section"><h2>تفاصيل الفرصة</h2><div class="description">' + escapeHtml(desc) + '</div></div>' : '')         + '<div class="contact-box">'           + '<h3>مهتم بهذه الفرصة؟</h3>'           + '<p>تواصل معنا مباشرةً للحصول على مزيد من المعلومات.</p>'           + '<div class="contact-actions">'             + '<a class="btn btn-primary" href="mailto:info@cairobusiness.net?subject=' + encodeURIComponent('استفسار عن: ' + title) + '">✉️ info@cairobusiness.net</a>'             + '<a class="btn btn-outline" href="tel:+201030887766">📞 01030887766</a>'           + '</div>'         + '</div>';       root.innerHTML = html;     }      load();   })();   </script> </body> </html>
